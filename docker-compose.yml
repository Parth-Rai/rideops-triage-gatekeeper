version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rideops
      POSTGRES_PASSWORD: rideops_password
      POSTGRES_DB: rideops_support
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rideops -d rideops_support"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: postgres://rideops:rideops_password@db:5432/rideops_support
      DATABASE_SSL: "false"
      CSV_PATH: /app/data/rideops_support_tickets.csv
    ports:
      - "5000:5000"